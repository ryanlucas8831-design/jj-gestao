<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JJ Gestão">
<meta name="description" content="Diárias, vales, cartão e pagamentos da equipe da JJ Transporte.">
<script src="firebase-config.js"></script>
<title>JJ Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* JJ Gestão. Barlow na interface, números em Barlow Semi Condensed.
   Uma tela por tarefa, botões grandes. Ciano = o que se toca. Laranja do JJ = marca e "hoje". Verde = pago. Sem brilho, sem degradê. */
:root{
 --bg:#0A0F18; --s1:#111824; --s2:#161F2E; --s3:#1C2638;
 --bd:#1E2838; --bd2:#2A3549; --tx:#E9EEF5; --tx2:#C1CAD7; --mu:#8C97A9; --mu2:#667184;
 --cy:#3FC9D6; --cy-ink:#04242A; --cy-soft:rgba(63,201,214,.09); --cy-line:rgba(63,201,214,.34);
 --or:#F5893A; --or-soft:rgba(245,137,58,.11); --ok:#3DC98E; --ok-soft:rgba(61,201,142,.1);
 --rd:#EE6A78; --rd-soft:rgba(238,106,120,.1); --wa:#1E9E52;
 --shadow:0 18px 40px -22px rgba(0,0,0,.75); --card-sh:none; --tab:rgba(10,15,24,.95); --stage:#070B12; --scrim:rgba(2,5,10,.62);
 --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --n:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
 color-scheme:dark; font-size:16px;
}
:root[data-ui="light"]{
 --bg:#F3F5F8; --s1:#FFFFFF; --s2:#F6F8FA; --s3:#ECEFF3;
 --bd:#E3E7ED; --bd2:#D3D9E1; --tx:#111A27; --tx2:#344155; --mu:#5F6B7D; --mu2:#8D97A6;
 --cy:#0E7F8C; --cy-ink:#FFFFFF; --cy-soft:rgba(14,127,140,.07); --cy-line:rgba(14,127,140,.36);
 --or:#D4691B; --or-soft:rgba(212,105,27,.09); --ok:#14865A; --ok-soft:rgba(20,134,90,.09);
 --rd:#C2394A; --rd-soft:rgba(194,57,74,.07);
 --shadow:0 16px 36px -20px rgba(17,26,39,.3); --card-sh:0 1px 2px rgba(17,26,39,.05),0 1px 1px rgba(17,26,39,.03); --tab:rgba(255,255,255,.97); --stage:#E4E8EE; --scrim:rgba(17,26,39,.36);
 color-scheme:light;
}
:root[data-fs="grande"]{font-size:18px}
/* áreas do celular (barra de status em cima, gestos embaixo): no app Android vêm do Capacitor, no navegador do próprio sistema */
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
*,*:before,*:after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:1rem;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--tx)}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--cy);outline-offset:2px;border-radius:10px}
svg.i{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--n);font-weight:700;letter-spacing:-.01em}

/* ===== estrutura ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:calc(22px + var(--sat)) 14px calc(18px + var(--sab));border-right:1px solid var(--bd);background:var(--s1)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
.mark{width:44px;height:44px;border-radius:13px;background:#0B1628;border:1px solid #24375A;display:grid;place-items:center;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{display:block;font-size:1.06rem;font-weight:700;letter-spacing:.01em}
.brand span{font-size:.8rem;color:var(--mu);font-weight:500}
.navb{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;border-radius:10px;font-size:1rem;font-weight:600;color:var(--mu);overflow:hidden;transition:color .15s,background .15s}
.navb:hover{color:var(--tx);background:var(--s2)}
.navb[aria-current="page"]{color:var(--tx);background:var(--s2)}
.navb[aria-current="page"] svg{color:var(--cy)}
.navb[aria-current="page"]:after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cy)}
.navb em{margin-left:auto;font-style:normal;font-size:.75rem;font-weight:700;color:#1A0E02;background:var(--or);min-width:22px;height:20px;border-radius:6px;display:grid;place-items:center;padding:0 6px}
.side .talk{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);text-align:left;position:relative;overflow:hidden}
.side .talk b{display:block;font-size:1rem;font-weight:700}
.side .talk span{font-size:.8rem;color:var(--mu)}
.side .acct{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--bd);width:100%;text-align:left}
.side .acct i{width:34px;height:34px;border-radius:50%;background:#0B1A33;border:1px solid #2A3E60;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.8rem;color:#fff;flex:none}
.side .acct b{display:block;font-size:.88rem;font-weight:600}
.side .acct span{font-size:.75rem;color:var(--mu)}
.main{min-width:0;padding:28px 36px 140px;max-width:1240px;width:100%}
.mtop{display:none}
.tabbar{display:none}
.view{animation:vin .26s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stag>*{animation:vin .32s cubic-bezier(.2,.9,.3,1) both}
.stag>*:nth-child(2){animation-delay:.03s}.stag>*:nth-child(3){animation-delay:.06s}.stag>*:nth-child(4){animation-delay:.09s}.stag>*:nth-child(5){animation-delay:.12s}.stag>*:nth-child(6){animation-delay:.15s}.stag>*:nth-child(7){animation-delay:.18s}.stag>*:nth-child(n+8){animation-delay:.21s}

/* ===== peças ===== */
.vh{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.vh .eb{font-size:.9rem;color:var(--mu);font-weight:600;margin-bottom:2px}
.vh h1{font-size:2.15rem;font-weight:700;letter-spacing:-.015em;line-height:1.08;text-wrap:balance}
.sp{flex:1}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;position:relative;min-width:0;box-shadow:var(--card-sh)}
div.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 12px}
div.sec h2{font-size:1.18rem;font-weight:700;letter-spacing:-.005em}
div.sec .k{font-size:.9rem;color:var(--mu);font-weight:600}
.k{font-size:.88rem;color:var(--mu);font-weight:600}
.muted{color:var(--mu2)}
.neg{color:var(--rd)}
.okc{color:var(--ok)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:1rem;white-space:nowrap;text-decoration:none;border:1px solid transparent;transition:transform .12s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,background .2s,filter .2s;user-select:none}
.btn:active{transform:translateY(1px) scale(.975)}
.btn svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--cy);color:var(--cy-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);color:#03221A;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
:root[data-ui="light"] .btn.ok{color:#fff}
.btn.sec{background:var(--s2);border-color:var(--bd2);color:var(--tx)}
.btn.sec:hover{background:var(--s3)}
.btn.wa{background:var(--wa);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.dg{background:var(--rd-soft);border-color:color-mix(in srgb,var(--rd) 40%,transparent);color:var(--rd)}
.btn.sm{min-height:40px;font-size:.92rem;padding:0 14px;border-radius:10px}
.btn.xl{min-height:58px;font-size:1.1rem;border-radius:13px;padding:0 24px}
.btn.wide{width:100%}
.btn.mk{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.btn.mk:hover{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.iconb{position:relative;overflow:hidden;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--bd2);flex:none;transition:transform .12s}
.iconb:active{transform:scale(.93)}
.iconb[disabled]{opacity:.35;pointer-events:none}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1.05rem;flex:none;color:#fff!important}
.av.s{width:34px;height:34px;border-radius:9px;font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:8px;font-size:.84rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.or{background:var(--or-soft);color:var(--or);border-color:color-mix(in srgb,var(--or) 30%,transparent)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pill.rd{background:var(--rd-soft);color:var(--rd);border-color:color-mix(in srgb,var(--rd) 30%,transparent)}
.pill.cy{background:var(--cy-soft);color:var(--cy);border-color:var(--cy-line)}
.qnav{display:flex;align-items:center;gap:4px;height:48px;padding:0 4px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);font-weight:600;box-shadow:var(--card-sh)}
.qnav span{padding:0 8px;white-space:nowrap}
.qnav button{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--mu)}
.qnav button:hover{background:var(--s2);color:var(--tx)}
.qnav button[disabled]{opacity:.3;pointer-events:none}
.empty{padding:40px 22px;text-align:center;color:var(--mu);font-size:1rem;line-height:1.55}
.empty b{display:block;color:var(--tx);font-size:1.15rem;margin-bottom:4px}
.empty .btn{margin-top:16px}
.inp{width:100%;min-height:50px;border-radius:12px;background:var(--s2);border:1px solid var(--bd2);padding:0 16px;font-size:1rem;font-weight:500;outline:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--cy);box-shadow:0 0 0 4px var(--cy-soft)}
.inp::placeholder{color:var(--mu2)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.fl{display:block;font-size:.88rem;color:var(--mu);font-weight:600;margin:16px 0 7px}
.hlp{font-size:.84rem;color:var(--mu);margin-top:6px;line-height:1.45}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--s2);border:1px solid var(--bd)}
.seg button{position:relative;overflow:hidden;flex:1;min-height:42px;padding:0 14px;border-radius:9px;font-size:.95rem;font-weight:600;color:var(--mu);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--bd2)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 0;border-top:1px solid var(--bd)}
.tg b{display:block;font-size:1rem;font-weight:600}
.tg span{font-size:.86rem;color:var(--mu)}
.sw{width:50px;height:30px;border-radius:20px;background:var(--bd2);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
[aria-checked="true"]>.sw{background:var(--cy)}
[aria-checked="true"]>.sw:after{transform:translateX(20px)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--bd);font-size:.96rem}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--mu)}
.kv b{font-weight:700}

/* ondinha do toque */
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ===== entrada ===== */
.login{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(400px,.85fr)}
.lg-l{padding:44px 64px 40px;display:flex;flex-direction:column;min-width:0;background:var(--s1);border-right:1px solid var(--bd)}
.lg-eb{display:inline-flex;align-items:center;gap:10px;font-size:.92rem;font-weight:600;color:var(--mu);margin-top:auto}
.lg-eb i{width:22px;height:2px;border-radius:2px;background:var(--or)}
.lg-l h1{font-size:3.25rem;font-weight:700;line-height:1.03;letter-spacing:-.025em;margin:14px 0 18px;max-width:640px;text-wrap:balance}
.lg-l h1 em{font-style:normal;color:var(--cy)}
.lg-l>p{font-size:1.12rem;color:var(--mu);max-width:540px;line-height:1.55}
.lg-prev{position:relative;margin:36px 0 auto;height:282px;max-width:580px}
.pv-doc{position:absolute;right:6px;top:4px;width:196px;height:272px;background:#fff;border-radius:6px;transform:rotate(4deg);box-shadow:0 24px 48px -22px rgba(0,0,0,.6);overflow:hidden}
.pv-doc .hd{height:46px;background:#0B1A33;display:flex;align-items:center;gap:8px;padding:0 12px}
.pv-doc .hd i{display:block;height:5px;border-radius:2px;background:#fff;opacity:.85;margin-left:auto;width:62px}
.pv-doc .st{display:flex;height:3px}.pv-doc .st i{flex:3;background:#23C6D2}.pv-doc .st i+i{flex:1;background:#FF8A2B}
.pv-doc .bd{padding:12px;display:flex;flex-direction:column;gap:8px}
.pv-doc .bx{display:flex;gap:6px}.pv-doc .bx i{flex:1.4;height:36px;border-radius:3px;background:#EEF1F5;border-left:3px solid #FF8A2B}.pv-doc .bx i+i{flex:1;background:#0B1A33;border:0}
.pv-doc .cl{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.pv-doc .cl i{height:9px;border-radius:1px;background:#0B1A33}.pv-doc .cl i.o{background:#E3E7EC}
.pv-doc .ln{height:4px;border-radius:2px;background:#E1E6EC}.pv-doc .ln.s{width:62%}
.pv-doc .stp{position:absolute;right:16px;bottom:22px;transform:rotate(-9deg);border:2px solid #1E8A57;color:#1E8A57;font-weight:800;font-size:15px;letter-spacing:.18em;padding:1px 8px;border-radius:4px;background:rgba(255,255,255,.7)}
.pv-card{position:absolute;left:0;top:0;width:min(410px,76%);padding:16px 18px 8px;border-radius:16px;background:var(--bg);border:1px solid var(--bd2);box-shadow:var(--shadow)}
.pv-card .pk{font-size:.82rem;color:var(--mu);font-weight:600}
.pv-card .pt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 10px}
.pv-card .pt b{font-family:var(--n);font-size:1.95rem;font-weight:700;letter-spacing:-.01em}
.pv-card .pt span{font-size:.8rem;color:var(--mu)}
.pv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.pv-row .av{width:32px;height:32px;border-radius:9px;font-size:.82rem}
.pv-row b{flex:1;font-size:.96rem;font-weight:600}
.pv-row .v{font-family:var(--n);font-weight:700;font-size:1.05rem}
.tg2{font-size:.76rem;font-weight:700;padding:4px 9px;border-radius:6px;white-space:nowrap}
.tg2.ok{background:var(--ok-soft);color:var(--ok)}.tg2.cy{background:var(--cy);color:var(--cy-ink)}.tg2.or{background:var(--or-soft);color:var(--or)}
.lg-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px;padding-top:22px;border-top:1px solid var(--bd);max-width:660px}
.lg-facts div{font-size:.9rem;color:var(--mu);line-height:1.42}
.lg-facts b{display:block;color:var(--tx);font-size:.98rem;font-weight:700;margin-bottom:3px}
.lg-facts.m{display:none}
.lg-r{display:grid;place-items:center;padding:32px 40px}
.lcard{width:100%;max-width:400px}
.lcard h2{font-size:1.85rem;font-weight:700;letter-spacing:-.015em;margin:26px 0 6px}
.lcard>p{color:var(--mu);line-height:1.5}
.gbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;border-radius:12px;background:#fff;color:#1F1F1F;font-weight:700;font-size:1.05rem;margin-top:26px;border:1px solid #DADCE0;transition:transform .12s}
.gbtn:active{transform:scale(.98)}
.ob-out{display:block;margin:-14px auto 18px;color:var(--cy);font-weight:600;font-size:.92rem;padding:6px 10px}
.cst{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;color:var(--mu2);margin-left:2px}
.cst svg{width:1.05rem;height:1.05rem}
.cst.ok{color:var(--ok)}.cst.push,.cst.load{color:var(--cy);animation:blink 1.1s infinite}.cst.offline{color:var(--or)}.cst.err{color:var(--rd)}
.lg-st{min-height:1.4em;margin-top:12px;font-size:.92rem;color:var(--mu);text-align:center}
.lg-st .er{color:var(--rd)}.lg-st b{color:var(--tx)}
.gbtn.busy{opacity:.75;pointer-events:none}
.gbtn.busy:after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid #C9D2DE;border-top-color:#4285F4;animation:sp .8s linear infinite;margin-left:4px}
.acct i.ph{padding:0;overflow:hidden;background:var(--s3)}.acct i.ph img{width:100%;height:100%;object-fit:cover;display:block}
.orl{display:flex;align-items:center;gap:12px;margin:22px 0 6px;font-size:.84rem;color:var(--mu2);font-weight:600}
.orl:before,.orl:after{content:"";flex:1;height:1px;background:var(--bd)}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--bd);font-size:.86rem;line-height:1.45;color:var(--tx2)}
.note svg{color:var(--mu);margin-top:1px}
.linkb{color:var(--cy);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lg-demo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--bd2);width:100%;text-align:left;position:relative;overflow:hidden}
.lg-demo b{display:block;font-weight:700}.lg-demo span{font-size:.86rem;color:var(--mu)}
.lg-demo:hover{background:var(--s2)}

/* ===== primeiro acesso ===== */
.ob{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(36px + var(--sat)) 16px calc(36px + var(--sab))}
.steps{display:flex;align-items:center;width:100%;max-width:620px;margin:0 auto 24px}
.step{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:600;color:var(--mu);white-space:nowrap}
.step i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;background:var(--s2);border:1px solid var(--bd2);font-weight:700}
.step.done{color:var(--tx)}.step.done i{background:var(--cy);border-color:var(--cy);color:var(--cy-ink)}
.step.now{color:var(--tx)}.step.now i{border-color:var(--cy);color:var(--cy);box-shadow:0 0 0 4px var(--cy-soft)}
.line{flex:1;height:2px;min-width:18px;margin:0 12px;background:var(--bd2);border-radius:2px}

.asst{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.asst .bk{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.asst .pn{position:relative;width:min(480px,100%);height:100%;background:var(--s1);border-left:1px solid var(--bd2);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.6);animation:slin .32s cubic-bezier(.2,.9,.3,1)}
@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.ah{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--sat)) 18px 16px;border-bottom:1px solid var(--bd)}
.ah h2{font-size:1.2rem;font-weight:700}
.ah p{font-size:.86rem;color:var(--mu)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;animation:vin .25s}
.m.me{align-self:flex-end}
.bub{padding:12px 15px;border-radius:16px;font-size:1rem;line-height:1.5}
.me .bub{background:var(--cy);color:var(--cy-ink);border-bottom-right-radius:6px;font-weight:500}
.ai .bub{background:var(--s2);border:1px solid var(--bd);border-bottom-left-radius:6px}
.mt{font-size:.75rem;color:var(--mu2);margin-top:4px}
.me .mt{text-align:right}
.voice{display:flex;align-items:center;gap:8px;margin-bottom:6px;opacity:.9}
.voice i{display:block;width:3px;border-radius:2px;background:currentColor}
.lc{margin-top:10px;border-radius:14px;border:1px solid var(--bd2);overflow:hidden;background:var(--s1)}
.lc .rw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--bd);font-size:.95rem}
.lc .rw:first-child{border-top:0}
.lc .rw b{flex:1;font-weight:600}
.lc .rw b small{display:block;font-size:.82rem;color:var(--mu);font-weight:600;margin-top:1px}
.lc .rw .v{font-family:var(--n);font-weight:700;min-width:88px;text-align:right}
.ba{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.okline{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:700;color:var(--ok);font-size:.9rem}
.typing{display:flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mu);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.sugs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sug{position:relative;overflow:hidden;flex:none;min-height:38px;padding:0 14px;border-radius:20px;border:1px solid var(--bd2);background:var(--s2);font-size:.9rem;font-weight:600}
.ain{display:flex;align-items:flex-end;gap:10px;padding:10px 12px calc(12px + var(--sab));border-top:1px solid var(--bd)}
.ain input,.ain textarea{flex:1;min-width:0;min-height:52px;max-height:150px;border-radius:14px;background:var(--s2);border:1px solid var(--bd2);padding:14px 16px;font-size:1rem;line-height:1.35;outline:0;resize:none;font-family:inherit;color:var(--tx);overflow-y:auto}
.ain input:focus,.ain textarea:focus{border-color:var(--cy)}
.micb{position:relative;width:56px;height:56px;border-radius:50%;background:var(--cy);color:var(--cy-ink);display:grid;place-items:center;flex:none;transition:transform .12s}
.micb:active{transform:scale(.92)}
.micb svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
.mhint{display:none;align-items:center;gap:8px;padding:8px 16px 0;font-size:.9rem;color:var(--tx2)}
.mhint.on{display:flex}.mhint svg{width:1.05rem;height:1.05rem;color:var(--ok)}
.mhint .rdot{width:9px;height:9px;border-radius:50%;background:var(--rd);animation:blink 1s infinite;flex:none}
.sendb.ready{background:var(--cy);border-color:var(--cy);color:var(--cy-ink);animation:sendp 1.6s ease-in-out infinite}
@keyframes sendp{0%,100%{box-shadow:0 0 0 0 var(--cy-line)}50%{box-shadow:0 0 0 8px transparent}}
.micb.rec{background:var(--rd);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px var(--rd-soft)}50%{box-shadow:0 0 0 14px transparent}}
.sendb{width:52px;height:52px;border-radius:13px;background:var(--s2);border:1px solid var(--bd2);display:grid;place-items:center;flex:none}

/* ===== janelas ===== */
.mw{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.mw .bk{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(3px);animation:fade .2s}
.md{position:relative;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;border-radius:20px;background:var(--s1);border:1px solid var(--bd2);box-shadow:0 50px 100px -30px rgba(0,0,0,.8);padding:24px 24px 0;animation:pop .3s cubic-bezier(.2,1.1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:flex-start;gap:12px}
.mh h3{font-size:1.4rem;font-weight:700}
.mh p{color:var(--mu);margin-top:3px;line-height:1.45}
.xb{width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;margin-left:auto;flex:none}
.mf{display:flex;gap:10px;position:sticky;bottom:0;z-index:3;margin:22px -24px 0;padding:14px 24px 22px;background:var(--s1);border-top:1px solid var(--bd)}
.md>:last-child:not(.mf){margin-bottom:24px}
.mf .btn{flex:1}
.mf .btn.sec,.mf .btn.dg{flex:0 1 auto}
.money{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2.5px solid var(--cy)}
.money span{font-family:var(--n);font-size:1.4rem;color:var(--mu);font-weight:600}
.money input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--n);font-size:2.4rem;font-weight:700;padding:0}
.quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick button{position:relative;overflow:hidden;min-height:40px;padding:0 14px;border-radius:20px;background:var(--s2);border:1px solid var(--bd2);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px 0 6px;border-radius:24px;border:1.5px solid var(--bd2);font-weight:600;transition:all .15s}
.chips button.plain{padding-left:14px}
.chips .av{width:34px;height:34px;border-radius:50%;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--cy-soft);border-color:var(--cy)}
.split{margin-top:14px;border-radius:16px;border:1.5px dashed color-mix(in srgb,var(--or) 55%,transparent);background:var(--or-soft);padding:14px;animation:vin .25s}
.split .t{font-weight:700;color:var(--or);margin-bottom:10px}
.split.ok{border-color:var(--cy-line);background:var(--cy-soft)}.split.ok .t{color:var(--cy)}
.sbar{display:flex;height:9px;border-radius:6px;overflow:hidden;margin-bottom:8px;background:var(--s3)}
.sbar i{display:block;height:100%}
.spr{display:flex;align-items:center;gap:10px;padding:6px 0}
.spr i{width:11px;height:11px;border-radius:3px;flex:none}
.spr div{flex:1;font-weight:600}.spr div span{display:block;font-size:.84rem;color:var(--mu);font-weight:500}
.spr b{font-family:var(--n);font-size:1.15rem}
.warn{display:flex;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--rd-soft);border:1px solid color-mix(in srgb,var(--rd) 30%,transparent);font-size:.92rem;line-height:1.45}
.warn svg{color:var(--rd);margin-top:1px}
.share-st{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--s2);border:1px solid var(--bd);margin-top:16px}
.share-st .pdfi{width:46px;height:56px;border-radius:8px;background:#fff;display:grid;place-items:center;color:#B23A3F;font-weight:800;font-size:.8rem;flex:none;box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.share-st b{display:block;overflow-wrap:anywhere}
.share-st span{font-size:.86rem;color:var(--mu)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--bd2);border-top-color:var(--cy);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== pagamento, Pix e comprovante ===== */
.paybox{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--s2);border:1px solid var(--bd)}
.paytop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.paytop b{display:block;font-family:var(--n);font-size:1.9rem;font-weight:700;line-height:1.05}
.paytop span{font-size:.86rem;color:var(--mu);font-weight:600}
.pbar{height:6px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.seqh{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:.88rem;color:var(--mu);font-weight:600}
.seqh .pbar{flex:1;margin:0}.seqh .pbar i{background:var(--cy)}
.pix{display:grid;grid-template-columns:156px minmax(0,1fr);gap:16px;align-items:center;margin-top:12px;padding:14px;border-radius:14px;border:1px solid var(--bd2);background:var(--s1)}
.pix.noqr{grid-template-columns:minmax(0,1fr)}
.pix .qr{width:156px;height:156px;border-radius:10px;background:#fff;padding:8px;display:grid;place-items:center}
.pix .qr img{width:100%;height:100%;image-rendering:pixelated}
.pix .qr .spin{border-color:#DDE3EA;border-top-color:#0E7F8C}
.pix .who>b{display:block;font-size:1.05rem;font-weight:700}
.pix .who span{display:block;font-size:.86rem;color:var(--mu);overflow-wrap:anywhere}
.pix .acol{margin-top:12px;gap:8px}
.pix ol{margin:10px 0 0;padding-left:18px;font-size:.84rem;color:var(--mu);line-height:1.55}
.pix ol b{color:var(--tx2)}
.qrtog{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.86rem;font-weight:700;color:var(--cy)}
.nokey{margin-top:12px;padding:14px;border-radius:14px;border:1.5px dashed var(--bd2)}
.drop{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--bd2);color:var(--tx);font-weight:700;text-align:left;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--cy);background:var(--cy-soft)}
.drop i{width:40px;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;color:var(--cy);flex:none}
.drop span{display:block;font-size:.84rem;color:var(--mu);font-weight:500}
.cthumb{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--bd2);background:var(--s2)}
.cthumb .im{width:66px;height:88px;border-radius:7px;background:#fff;flex:none;overflow:hidden;cursor:zoom-in;position:relative}
.cthumb .im img{width:100%;height:100%;object-fit:cover;object-position:top}
.cthumb .x{flex:1;min-width:0}
.cthumb .x>b{display:block;font-weight:700}
.cthumb .x>span{font-size:.84rem;color:var(--mu)}
.cthumb .ba{margin-top:8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;line-height:1.4;margin-top:6px;font-weight:600}
.chk svg{width:17px;height:17px;flex:none;margin-top:1px}
.chk.ok{color:var(--ok)}.chk.w{color:var(--or)}.chk.bad{color:var(--rd)}.chk.mu{color:var(--mu);font-weight:500}
.reading{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.9rem;color:var(--mu);font-weight:600}
.clip{display:inline-flex;align-items:center;gap:4px;color:var(--cy);font-weight:700;font-size:.86rem;position:relative}
.clip svg{width:15px;height:15px}
.paid.part{background:var(--or-soft);color:var(--or);border-color:color-mix(in srgb,var(--or) 35%,transparent)}
.paid .cl{width:15px;height:15px;opacity:.85}
.pays .pi{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.pays .pi:first-child{border-top:0}
.pays .pi .x{flex:1;min-width:0}.pays .pi .x b{display:block;font-family:var(--n);font-size:1.2rem;font-weight:700}.pays .pi .x span{font-size:.86rem;color:var(--mu)}
.cview{margin-top:14px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--bd2)}
.cview img{display:block;width:100%;height:auto}
.cmeta{margin-top:12px}
.ckrow.sm{padding:6px 0;font-size:.92rem}
.inst{display:flex;gap:12px;align-items:flex-start}
.inst i{width:44px;height:44px;border-radius:11px;background:#0B1A33;display:grid;place-items:center;flex:none}
.inst ol{margin:8px 0 0;padding-left:18px;color:var(--mu);font-size:.9rem;line-height:1.6}
.shpick .pl{border:1px solid var(--bd);margin-top:8px}
.lbx{position:fixed;inset:0;z-index:80;background:rgba(2,5,10,.86);display:grid;place-items:center;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));animation:fade .15s;cursor:zoom-out}
.lbx img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
.lbx .xb{position:absolute;top:16px;right:16px;background:#1C2638;color:#fff}

/* ===== aviso e animação de salvar ===== */
.toast{position:fixed;left:16px;right:16px;bottom:28px;margin:0 auto;width:max-content;z-index:70;transform:translateY(24px);opacity:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:4px;max-width:min(620px,calc(100% - 32px));padding:12px 14px;border-radius:14px;background:#142033;color:#EEF3FB;border:1px solid #2A3A55;box-shadow:0 20px 40px -14px rgba(0,0,0,.6);font-weight:600;transition:all .35s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .tm{flex:1 1 170px;min-width:0;line-height:1.35}
.toast .ta{display:flex;gap:2px;margin-left:auto}
.toast .ok{width:26px;height:26px;border-radius:50%;background:#3DC98E;display:grid;place-items:center;flex:none}
.toast .ok svg{width:14px;height:14px;fill:none;stroke:#04221A;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.toast .bolt{display:inline-flex;flex-direction:column;gap:2.5px;margin-right:9px;vertical-align:middle;transform:translateY(-1px)}.toast .bolt i{display:block;height:2.5px;border-radius:2px;background:#F5893A}.toast .bolt i:nth-child(1){width:13px}.toast .bolt i:nth-child(2){width:9px;margin-left:4px;opacity:.75}.toast .bolt i:nth-child(3){width:5px;margin-left:8px;opacity:.5}
.toast .ok.err{background:#FF8A2B;color:#2A1300;font-weight:800;font-size:1rem}
body:has(.savebar) .toast{bottom:122px}
body:has(.asst) .toast{bottom:104px}
body:has(.mw) .toast{bottom:auto;top:22px}
.toast button{color:#5FD8E3;font-weight:700;padding:6px 6px;pointer-events:auto}
.whoosh{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
.whoosh .wl{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:wl .8s cubic-bezier(.5,0,.2,1) forwards;opacity:0}
@keyframes wl{0%{transform:translateX(-60vw);opacity:0}20%{opacity:1}100%{transform:translateX(110vw);opacity:0}}
.whoosh .wm{position:absolute;top:42%;left:0;animation:wm .9s cubic-bezier(.5,0,.25,1) forwards}
@keyframes wm{0%{transform:translateX(-200px) skewX(-8deg);opacity:0}25%{opacity:1}100%{transform:translateX(110vw) skewX(-8deg);opacity:0}}
.loader{position:fixed;inset:0;z-index:66;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,9,16,.7);color:#EEF3FB;font-weight:700;font-size:1.1rem}
.ldoc{width:64px;height:82px;border-radius:9px;background:#fff;padding:14px 10px}
.ldoc i{display:block;height:6px;border-radius:3px;background:#DCE2EA;margin-bottom:8px;animation:ldl .9s ease-in-out infinite alternate}
.ldoc i:nth-child(2){width:70%;animation-delay:.15s}.ldoc i:nth-child(3){width:85%;animation-delay:.3s}.ldoc i:nth-child(4){width:50%;animation-delay:.45s}
@keyframes ldl{to{background:#3FC9D6}}
#printArea{display:none}

/* ===== documento A4 (estilo C, identidade JJ) ===== */
.a4{--nv:#0B1A33;--dcy:#23C6D2;--dor:#FF8A2B;--dtx:#1B2433;--dtx2:#3B4659;--dmu:#6B7686;--dln:#DFE4EA;--dln2:#EEF1F4;--zb:#F6F8FA;--drd:#B3343B;--dok:#1E8A57;
 width:794px;min-height:1123px;background:#fff;color:var(--dtx);font-family:"Inter",Arial,sans-serif;font-feature-settings:"calt" 0,"tnum" 1;display:flex;flex-direction:column;font-size:11px;line-height:1.45;text-align:left;letter-spacing:0}
.a4 *{box-sizing:border-box}
.a4 .d-band{background:var(--nv);color:#fff;padding:30px 52px 26px;display:flex;align-items:center;gap:16px}
.a4 .d-band img{width:58px;height:40px;object-fit:contain;background:#fff;border-radius:6px}
.a4 .d-stripe{display:flex;height:4px}.a4 .d-stripe i{flex:3;background:var(--dcy)}.a4 .d-stripe i+i{flex:1;background:var(--dor)}
.a4 .d-co b{display:block;font-family:"Barlow",Arial,sans-serif;font-size:22px;font-weight:700;line-height:1.15}
.a4 .d-co span{font-size:10px;color:#A9B6CC}
.a4 .d-tt{margin-left:auto;text-align:right}
.a4 .d-tt h1{font-family:"Barlow",Arial,sans-serif;font-size:25px;font-weight:700;margin:0;line-height:1.1;letter-spacing:-.005em}
.a4 .d-tt p{font-size:10.5px;color:#A9B6CC;margin:4px 0 0}
.a4 .d-tt p b{color:#fff;font-weight:600}
.a4 .d-body{flex:1;padding:24px 52px 0;display:flex;flex-direction:column;position:relative}
.a4 .k{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dmu);font-weight:600}
.a4 .d-hero{display:grid;grid-template-columns:1fr 228px;gap:16px;margin-bottom:22px}
.a4 .d-who{padding:13px 16px;border:1px solid var(--dln);border-left:4px solid var(--dor);border-radius:6px}
.a4 .d-who .nm{display:block;font-family:"Barlow",Arial,sans-serif;font-weight:700;font-size:18px;margin:2px 0 9px}
.a4 .d-who .mt{display:grid;gap:10px}
.a4 .d-who .mt b{display:block;font-size:11px;font-weight:600;margin-top:2px}
.a4 .d-val{padding:14px 16px;border-radius:6px;background:var(--nv);color:#fff;display:flex;flex-direction:column;justify-content:center}
.a4 .d-val .k{color:#8FA0BB}
.a4 .d-val b{display:block;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-weight:700;font-size:31px;line-height:1.1;margin:4px 0 3px}
.a4 .d-val em{font-style:normal;font-size:10px;color:#C9D3E3}
.a4 .d-val.neg b{color:#FFB4BA}
.a4 .d-meta{display:grid;border:1px solid var(--dln);border-radius:6px;overflow:hidden;margin-bottom:20px}
.a4 .d-meta div{padding:10px 14px;border-left:1px solid var(--dln)}
.a4 .d-meta div:first-child{border-left:0}
.a4 .d-meta span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dmu);font-weight:600;margin-bottom:3px}
.a4 .d-meta b{font-size:12px;font-weight:600}
.a4 .d-sec{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid var(--dtx);padding-bottom:5px;margin:0 0 9px}
.a4 .d-sec h2{font-family:"Barlow",Arial,sans-serif;font-size:14px;font-weight:700;color:var(--dtx);margin:0}
.a4 .d-sec span{font-size:9.5px;color:var(--dmu);font-weight:500}
.a4 .d-cal{display:grid;gap:3px;margin-bottom:22px}
.a4 .d-cal div{text-align:center;padding:4px 0 3px;border:1px solid #E3E7EC;border-radius:4px;color:#A0A9B5}
.a4 .d-cal b{display:block;font-family:"Barlow Semi Condensed",Arial,sans-serif;font-size:12px;font-weight:600;line-height:1.2}
.a4 .d-cal small{font-size:7.5px}
.a4 .d-cal div.w{background:var(--nv);border-color:var(--nv);color:#fff}
.a4 table{width:100%;border-collapse:collapse;margin:0}

function calc(pid,q,depth){
  const mk=pid+"|"+q.key;if(memo.has(mk))return memo.get(mk);depth=depth||0;
  const ds=S.dias.filter(d=>d.pid===pid&&inQ(d.date,q)).sort((a,b)=>a.date<b.date?-1:1);
  const bruto=ds.reduce((s,d)=>s+d.valor,0);
  const vs=S.vales.filter(v=>v.pid===pid&&inQ(v.date,q)).sort((a,b)=>a.date<b.date?-1:1);
  const valesSum=vs.reduce((s,v)=>s+v.valor,0);
  const cs=S.cartao.filter(c=>c.pid===pid&&inQ(c.date,q));const ref=cs.reduce((s,c)=>s+c.valor,0);
  let carry=0;const pq=qShift(q,-1);
  if(pq.end>=EARLIEST&&depth<80){const c=calc(pid,pq,depth+1);if(c.liquido<0)carry=c.liquido}
  const liquido=Math.round((bruto-valesSum+carry)*100)/100;
  const pays=paysOf(q.key+"|"+pid).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0),tot=Math.max(0,liquido);
  const paid=r2(pays.reduce((a,x)=>a+(x.valor==null?tot:x.valor),0)),full=tot>0&&paid>=tot-0.005,falta=full?0:Math.max(0,r2(tot-paid));
  const last=pays[pays.length-1];
  const pago=full?{date:last.date,hora:last.hora,forma:[...new Set(pays.map(x=>x.forma))].join(" + "),n:pays.length}:null;
  const r={ds,n:ds.length,bruto,vs,valesSum,cs,ref,carry,liquido,pays,paid:Math.min(paid,tot),paidRaw:paid,full,falta,parcial:!full&&paid>0.004,pago};
  memo.set(mk,r);return r;
}
function qPeople(q){return S.people.map(p=>({p,c:calc(p.id,q)})).filter(o=>o.c.n||o.c.valesSum||o.c.carry||o.c.ref)}
function qTotals(q){
  const L=qPeople(q);const t={L,aPagar:0,pago:0,diarias:0,vales:0,bruto:0,cartao:0,valesN:0,pend:0};
  L.forEach(({c})=>{const v=Math.max(0,c.liquido);t.aPagar+=v;t.pago+=c.paid;if(v>0&&!c.full)t.pend++;t.diarias+=c.n;t.vales+=c.valesSum;t.bruto+=c.bruto;t.valesN+=c.vs.length});
  t.pago=r2(t.pago);t.aPagar=r2(t.aPagar);
  t.cartao=S.cartao.filter(c=>inQ(c.date,q)).reduce((s,c)=>s+c.valor,0);
  return t;
}

function repQ(q){
  const T=qTotals(q),rs=(S.repasses[q.key]||[]).slice().sort((a,b)=>a.date<b.date?-1:1),sent=r2(rs.reduce((a,x)=>a+x.valor,0));
  let viaF=0,nTot=0,nPaid=0;T.L.forEach(({c})=>{const tot=Math.max(0,c.liquido);if(tot>0){nTot++;if(c.full)nPaid++}c.pays.forEach(x=>{if(x.forma==="Filho")viaF+=x.valor==null?tot:x.valor})});
  viaF=r2(viaF);const outros=r2(T.pago-Math.min(viaF,T.pago)),need=r2(Math.max(0,T.aPagar-outros)),toSend=Math.max(0,r2(need-sent));
  return {T,rs,sent,need,toSend,viaF,nTot,nPaid,last:rs[rs.length-1]||null,saldo:r2(sent-viaF)};
}

function cartaoSplit(pid,date,valor,ignoreId){
  if(!pid)return {cartao:valor,vale:0,already:0};

const NOTIF_DEF={fecha:true,dia:true,filho:true,hora:"18:00"};

function notifPlan(){
  const out=[],cfg=notifCfg(),now=Date.now(),at=(iso,hm)=>{const [h,m]=hm.split(":").map(Number);const d=fromISO(iso);d.setHours(h,m||0,0,0);return d};
  const add=(id,iso,hm,title,body,go)=>{const d=at(iso,hm);if(d.getTime()>now+60000)out.push({id,title,body,schedule:{at:d,allowWhileIdle:true},smallIcon:"ic_stat_jj",iconColor:"#3FC9D6",extra:{go}})};
  const q=qOf(TODAY),T=qTotals(q),falta=r2(T.aPagar-T.pago);
  if(cfg.fecha&&T.pend>0){
    add(7001,addDays(q.end,-1),"09:00","A quinzena fecha amanhã",`Faltam ${plural(T.pend,"pessoa","pessoas")} para pagar · ${brl(falta)}`,"devo");
    add(7002,q.end,"09:00","A quinzena fecha hoje",`Faltam ${plural(T.pend,"pessoa","pessoas")} para pagar · ${brl(falta)}`,"devo")}
  if(cfg.dia){for(let k=0;k<7;k++){const d=addDays(TODAY,k);if(fromISO(d).getDay()===0)continue;if(k===0&&S.dias.some(x=>x.date===d))continue;
    add(7100+k,d,cfg.hora||"18:00","Marcou quem trabalhou hoje?","Toque para lançar as diárias do dia.","hoje")}}
  if(cfg.filho&&viaFilho()){const R_=repQ(q);if(R_.sent>0&&R_.nPaid<R_.nTot){const base=addDays(R_.last.date,2),d=base>TODAY?base:addDays(TODAY,1),n=R_.nTot-R_.nPaid;
    add(7200,d,"10:00",`Faltam ${n===1?"1 pessoa":n+" pessoas"} para marcar como paga${n>1?"s":""}`,`Quando ${filhoGen()?"o filho":first(S.settings.filhoNome)} avisar que pagou, marque no app para sair o recibo.`,"devo")}}
  return out;
}
async function notifRun(){const L=PL("LocalNotifications");if(!L||!S.session||!S.settings.onboarded)return;
  try{const p=await L.checkPermissions();if(p.display!=="granted")return;
    const pend=await L.getPending();const mine=(pend&&pend.notifications||[]).filter(n=>n.id>=7000&&n.id<8000).map(n=>({id:n.id}));if(mine.length)await L.cancel({notifications:mine});
    const list=notifPlan();if(list.length)await L.schedule({notifications:list});UI.notifN=list.length}catch(e){console.warn("notificações:",e)}}

function cloudStart(){
  if(!cloudOn())return;const uid=S.session.uid;cloudState("load");
  dbLoad().then(()=>{if(!cloudOn()||S.session.uid!==uid)return;
    if(CLOUD.unsub){CLOUD.unsub();CLOUD.unsub=null}
    let first=true;
    CLOUD.unsub=DB.F.onSnapshot(docRef(),{includeMetadataChanges:false},snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const d=snap.exists()?snap.data():null;
      if(first){first=false;
        if(!d){ // nuvem vazia: sobe o que já tem no aparelho
          if(S.settings.onboarded||S.people.length){S.mod=S.mod||Date.now();cloudPush(true);toast("Pronto: seus dados agora ficam guardados na nuvem.",{bolt:true})}else cloudState("ok");return}
        if((d.mod||0)>(S.mod||0)){applyRemote(d);cloudState("ok");return}
        if((S.mod||0)>(d.mod||0)){cloudPush(true);return}
        cloudState("ok");return}
      if(d&&(d.mod||0)>(S.mod||0)){ // mudou em outro aparelho

    },e=>{console.error(e);cloudState(e&&e.code==="permission-denied"?"err":"offline");if(e&&e.code==="permission-denied")toast("A nuvem recusou o acesso: confira as regras do Firestore.",{err:true})});
  }).catch(e=>{console.error(e);cloudState("offline")});

function loadScript(src){return new Promise((res,rej)=>{const ex=document.querySelector(`script[src="${src}"]`);if(ex&&ex.dataset.ok){res();return}const s=ex||document.createElement("script");s.src=src;s.onload=()=>{s.dataset.ok=1;res()};s.onerror=rej;if(!ex)document.head.appendChild(s)})}
function showLoader(t){hideLoader();const l=document.createElement("div");l.className="loader";l.id="loader";l.innerHTML=`<div class="ldoc"><i></i><i></i><i></i><i></i></div><span>${t}</span>`;document.body.appendChild(l)}
const hideLoader=()=>{const l=$("#loader");if(l)l.remove()};
let DLNS=null;
async function triggerDownload(blob,name){
  if(NATIVE()){try{return await nativeShare(blob,name,"Salvar ou enviar")}catch(e){console.warn(e)}}
  if(window.claude&&typeof window.claude.use==="function"){
    try{const d=DLNS||(DLNS=await window.claude.use("downloads"));if(d){await d.save({filename:name,data:blob});return "saved"}}
    catch(e){if(e&&e.code==="declined")return "declined";if(e&&e.code==="rate_limited")return "busy"}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return "saved";
}
async function makePDFBlob(pages){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  try{await document.fonts.ready}catch(e){}
  const holder=document.createElement("div");holder.style.cssText="position:fixed;left:-12000px;top:0;width:794px;z-index:-1;pointer-events:none";
  holder.innerHTML=pages.map(p=>`<div class="a4">${p}</div>`).join("");document.body.appendChild(holder);
  try{
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    pdf.setProperties({title:"JJ Gestão",creator:"JJ Gestão",author:S.settings.empresa});
    const els=[...holder.children];
    for(let i=0;i<els.length;i++){
      const cv=await window.html2canvas(els[i],{scale:2.5,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const img=cv.toDataURL("image/jpeg",.93);const ratio=cv.height/cv.width;let w=210,h=210*ratio;if(h>297){h=297;w=297/ratio}
      if(i)pdf.addPage();pdf.addImage(img,"JPEG",(210-w)/2,0,w,h,undefined,"FAST");
    }
    return pdf.output("blob");
  }finally{holder.remove()}
}

}

async function openShare(spec){
  try{await prepDocs(spec)}catch(e){}
  const B=build(spec);if(!B.pages.length){toast("Nada para enviar neste período.",{err:true});return}
  const tok=SHARE={url:waLink(B.wa,B.tel),text:B.wa,spec};
  openModal(`${mHead("Enviar no WhatsApp",`Para <b>${esc(B.to||"")}</b>${B.tel?" "+maskTel(B.tel):""}`)}
   <div class="share-st" id="shSt"><span class="spin"></span><div><b>Preparando o PDF…</b><span>${esc(B.name)}</span></div></div>
   ${B.comps?`<button type="button" class="ckrow sm" data-act="shareComp" style="margin-top:10px"><span class="cb ${docAnexo()?"on":""}"><svg><use href="#i-check"/></svg></span>Incluir ${B.comps>1?"os comprovantes":"o comprovante"} no PDF</button>`:""}
   <div class="acol" id="shActs" style="margin-top:14px"><button type="button" class="btn wa wide" data-act="waOpen">${I("i-wa")}Mandar o resumo escrito</button></div>
   <p class="hlp shint" id="shHint">Gerando o arquivo. Leva alguns segundos.</p>`,{kind:"share",spec});
  try{
    const blob=await makePDFBlob(B.pages);
    if(SHARE!==tok||!$("#shSt"))return;
    const file=new File([blob],B.name,{type:"application/pdf"});Object.assign(tok,{blob,file,name:B.name,title:B.title});const can=NATIVE()||canShareFiles(file);
    $("#shSt").innerHTML=`<span class="pdfi">PDF</span><div style="min-width:0"><b>${esc(B.name)}</b><span>${B.pages.length} ${B.pages.length===1?"página":"páginas"}, ${Math.max(1,Math.round(blob.size/1024))} KB</span></div><span class="pill ok" style="margin-left:auto">${I("i-check")}Pronto</span>`;
    $("#shActs").insertAdjacentHTML("afterbegin",`${can?`<button type="button" class="btn pri wide xl" data-act="shareFile">${I("i-share")}Enviar o PDF</button>`:""}<button type="button" class="btn ${can?"sec":"pri"} wide" data-act="shareDl">${I("i-down")}Baixar o PDF</button>`);
    $("#shHint").innerHTML=can?`Toque em <b>Enviar o PDF</b> e escolha o WhatsApp e a conversa.`:`Baixe o PDF e anexe na conversa do WhatsApp (clipe, depois Documento). O resumo escrito abre o WhatsApp direto.`;
  }catch(e){console.error(e);if(SHARE===tok&&$("#shSt")){$("#shSt").innerHTML=`<span class="pdfi">!</span><div><b>Não deu para gerar o PDF agora</b><span>Confira a internet. O resumo escrito ainda pode ser enviado.</span></div>`;$("#shHint").textContent=""}}
}

const NUMW={dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,um:1};
function wordsToDigits(t){return t.replace(/\b((?:dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|cem|cento|duzentos|trezentos|quatrocentos|quinhentos)(?:\s+e\s+(?:um|dois|tres|quatro|cinco|seis|sete|oito|nove|dez|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa))*)\b/g,m=>{const n=m.split(/\s+e\s+/).reduce((s,w)=>s+(NUMW[w]||0),0);return n?String(n):m})}
function parseDateIn(t){
  if(/\banteontem\b/.test(t))return addDays(TODAY,-2);
  if(/\bontem\b/.test(t))return addDays(TODAY,-1);
  const m=t.match(/\bdia (\d{1,2})\b/);if(m){const td=fromISO(TODAY);let d=new Date(td.getFullYear(),td.getMonth(),+m[1]);if(toISO(d)>TODAY)d=new Date(td.getFullYear(),td.getMonth()-1,+m[1]);return toISO(d)}
  const W=["domingo","segunda","terca","quarta","quinta","sexta","sabado"];
  for(let i=0;i<7;i++){if(new RegExp("\\b"+W[i]).test(t)&&!/\bhoje\b/.test(t)){const diff=(fromISO(TODAY).getDay()-i+7)%7;return addDays(TODAY,-diff)}}
  return TODAY;
}
function nameIdx(t,p){const full=norm(p.nome),fn=norm(first(p.nome));let i=t.indexOf(full);if(i>=0)return i;const m=new RegExp("\\b"+fn.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b").exec(t);return m?m.index:-1}
const ALLW=/\b(todo mundo|todos|toda a equipe|a equipe toda|a equipe|o pessoal todo|o pessoal|a turma toda|a turma)\b/;
function findPeople(t){
  const out=[],hits=[];
  if(ALLW.test(t))S.people.filter(p=>p.ativo).forEach(p=>out.push({p,idx:0,all:true}));

Como preencher:
- "lancar": a frase registra algo (quem trabalhou, vale, gasto no cartão, falta). Um item por pessoa e por coisa.
  - "dia": a pessoa trabalhou. valor = a diária dela, a não ser que a frase diga outro valor para aquele dia.
  - "vale": adiantamento. valor = o valor dito.
  - "cartao": gasto com refeição. pid = quem gastou, ou null se for geral. valor = o valor dito.
  - "tirar": a pessoa faltou ou a diária foi lançada errado.
  - Não repita "dia" para quem já trabalhou naquela data (veja "trabalharam" em ultimos_dias).
- "pergunta": responda em "resposta" usando só os números dos DADOS, no formato R$ 1.234,56. Seja direto: 1 a 3 frases.
- "documento": pedido para ver, mandar ou imprimir relatório, recibo, fechamento do mês, cartão do mês, extrato de vales, histórico ou planilha.
- "cadastrar": pedido para cadastrar pessoa nova (nome em nomes_desconhecidos).
- Datas: hoje é ${TODAY} (${DL[fromISO(TODAY).getDay()].toLowerCase()}). "ontem" = dia anterior. Dia da semana sem data = o mais recente que já passou, ou hoje. "dia 12" = dia 12 deste mês, ou do mês passado se ainda não chegou. Nunca use data futura.
- "todo mundo", "todos", "a equipe" = todas as pessoas ativas.
- Use só os ids da lista de pessoas. Apelido ou nome parecido vale (Joãozinho = João). Se citar alguém fora da lista, ponha o nome em nomes_desconhecidos e não invente id.
- Número por extenso vira número ("cinquenta" = 50).
- Se não der para entender, use "nao_entendi" e diga em "resposta" o que faltou.

DADOS:
${JSON.stringify(aiData())}

CONVERSA RECENTE:
${hist}

FRASE DO DONO: ${JSON.stringify(String(raw).slice(0,600))}`;

  propNo:d=>{const m=S.chat.find(x=>x.id===d.id);if(m&&m.prop){m.prop.status="cancelled";save();renderMsgs()}},
  propEdit:d=>{const m=S.chat.find(x=>x.id===d.id);if(!m||!m.prop)return;const it=m.prop.items[0];UI.diaDate=it.date;initSel();m.prop.items.filter(i=>i.t==="dia"&&i.date===it.date).forEach(i=>{UI.sel.add(i.pid);if(i.valor!==P(i.pid).diaria)UI.selVal[i.pid]=i.valor});
    m.prop.status="cancelled";save();UI.asst=false;renderAsst();UI.view="hoje";renderView(true);toast("Confira e aperte Salvar o dia.")},
  undo:()=>{const t=$("#toast");if(t._undo){const f=t._undo;t._undo=null;t.classList.remove("show");f()}},
  toastAction:()=>{const t=$("#toast");if(t._action){const f=t._action;t._action=null;t.classList.remove("show");f()}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(!f)return;if(t.tagName!=="A")e.preventDefault();f(t.dataset,t,e)});
document.addEventListener("keydown",e=>{
  const el=e.target;
  if((e.key===" "||e.key==="Enter")&&el&&el.getAttribute&&el.getAttribute("role")==="checkbox"&&el.dataset.act){e.preventDefault();ACT[el.dataset.act](el.dataset,el,e);return}
  if(e.key==="Escape"){if($(".lbx")){ACT.lbxClose();return}if($("#modalRoot").innerHTML){closeModal();return}if(UI.asst){ACT.asstClose();return}}
  if((e.key==="v"||e.key==="V")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&S.session&&S.settings.onboarded){if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT"||el.isContentEditable))return;if($("#modalRoot").innerHTML)return;e.preventDefault();ACT.falar()}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==="login"){loginGoogle();return}
  if(f==="chat"){MIC.dead=true;if(UI.rec)stopMic();const i=$("#chatIn");const v=i.value;const voz=!!MIC.voice&&v.trim()===MIC.voice;i.value="";growChat();MIC.voice="";const b=$(".ain .sendb");if(b)b.classList.remove("ready");sendChat(v,voz);micState()}
  if(f==="modal")saveModal();
});
let PIXT;
function growChat(){const i=$("#chatIn");if(!i)return;i.style.height="auto";i.style.height=Math.min(i.scrollHeight+2,150)+"px"}
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();const f=e.target.form;if(f){if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}}},true);
document.addEventListener("change",e=>{if(e.target&&e.target.id==="nHora"&&/^\d{2}:\d{2}$/.test(e.target.value)){S.settings.notif=Object.assign(notifCfg(),{hora:e.target.value});changed();toast("Horário salvo")}});
document.addEventListener("input",e=>{const id=e.target.id;if(id==="chatIn")growChat();
  if(id==="mVal"&&(mctx.kind==="pagar"||mctx.kind==="vale"||mctx.kind==="repasse")){mctx.valor=parseMoney(e.target.value);clearTimeout(PIXT);PIXT=setTimeout(renderPix,180)}
  if(id==="mVal"||id==="mDate")mLive();
  if(id==="pesBusca"){UI.pesQ=e.target.value;const pos=e.target.selectionStart;renderView();const b=$("#pesBusca");if(b){b.focus();try{b.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset&&el.dataset.set){const k=el.dataset.set;if(el.dataset.money){const v=parseMoney(el.value);if(v)S.settings[k]=v;el.value=num(S.settings[k])}else S.settings[k]=k==="empresa"?(el.value.trim()||"JJ Transporte"):k==="uf"?el.value.trim().toUpperCase().slice(0,2):el.value.trim();changed();chrome();toast("Ajuste salvo")}
  if(el.id==="docPid"){if(el.value==="__all")UI.docAll=true;else{UI.docAll=false;UI.docPid=el.value}UI.zoom=0;renderView()}
  if(el.id==="histYear"){UI.histYear=+el.value;renderView()}
  if(el.id==="fileImport"&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const o=migrate(JSON.parse(r.result));if(!o)throw 0;const imgs=o.compImgs||{};delete o.compImgs;const sess=S.session;S=o;S.session=sess;CIMG.clear();Object.keys(imgs).forEach(id=>compPut(id,imgs[id]));changed();render();toast("Backup restaurado")}catch(_){toast("Esse arquivo não é um backup do JJ Gestão.",{err:true})}};r.readAsText(el.files[0]);el.value=""}
  if(el.id==="fileComp"&&el.files[0]){const f=el.files[0];el.value="";if(f.size>25e6){toast("Arquivo grande demais. Use uma foto ou print.",{err:true});return}
    if(mctx.kind==="pagos"&&mctx.attach){const pay=mctx.attach;mctx.attach=null;attachToPay(f,mctx.qk+"|"+mctx.pid,pay)}else if(mctx.kind==="pagar"||mctx.kind==="vale")compAttach(f)}
  if(el.id==="fileLogo"&&el.files[0]){const f=el.files[0];if(f.size>700000){toast("Use uma imagem menor que 700 KB.",{err:true});el.value="";return}const r=new FileReader();r.onload=()=>{S.settings.logo=r.result;changed();renderView();toast("Logo atualizado nos documentos")};r.readAsDataURL(f);el.value=""}
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest(".drop");if(!d)return;e.preventDefault();d.classList.remove("over");const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&(mctx.kind==="pagar"||mctx.kind==="vale"))compAttach(f)});
setInterval(()=>{const t=toISO(new Date());if(t!==TODAY){TODAY=t;if(S.session&&S.settings.onboarded){UI.diaDate=TODAY;initSel();renderView()}}},30000);

/* ================= início ================= */
load();applyTheme();
const h=(location.hash||"").slice(1);if(VIEWS.includes(h))UI.view=h;
initSel();initAuthPre();initNative();render();splash();initAuth();initAI();initPWA();ensureQR();
})();

</script>
